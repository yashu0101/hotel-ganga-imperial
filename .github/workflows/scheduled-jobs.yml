name: Scheduled jobs

# Vercel Hobby cron runs only once a day, so this calls the same endpoint every 10 minutes to retry queued staff
# notifications (and apply the retention clean-up). Needs two repository secrets:
#   SITE_URL     the production URL, e.g. https://www.example.com
#   CRON_SECRET  the same value as the Vercel CRON_SECRET environment variable (32+ characters)
# Without them the job does nothing. GitHub may delay scheduled runs and pauses them after 60 days without
# repository activity; the daily Vercel cron remains as a fallback.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the scheduled-job endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET secret not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/notifications"
